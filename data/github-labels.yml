# Single-choice axes govern label definitions/taxonomy only; this manifest does
# not enforce that each issue has at most one label from an axis.
axes:
  type:
    - name: type/bug
      color: "#d73a4a"
      description: Something is not working as expected.
    - name: type/feature
      color: "#a2eeef"
      description: New feature or capability request.
    - name: type/docs
      color: "#0075ca"
      description: Documentation change or improvement.
    - name: type/maintenance
      color: "#fef2c0"
      description: Chore, refactor, dependency, or repository maintenance.
    - name: type/security
      color: "#d73a4a"
      description: Security vulnerability or hardening work.
    - name: type/question
      color: "#d4c5f9"
      description: Question or discussion item needing an answer.
  status:
    - name: status/needs-triage
      color: "#ededed"
      description: Needs initial review and classification.
    - name: status/needs-info
      color: "#d455d0"
      description: Waiting for more information from the reporter.
    - name: status/accepted
      color: "#8fc951"
      description: Accepted and ready to be worked.
    - name: status/blocked
      color: "#d73a4a"
      description: Blocked by an external dependency or decision.
    - name: status/in-progress
      color: "#fbca04"
      description: Work has started.
  priority:
    - name: priority/critical
      color: "#b60205"
      description: Urgent; address as soon as possible.
    - name: priority/high
      color: "#d93f0b"
      description: Important; prioritize soon.
    - name: priority/normal
      color: "#fbca04"
      description: Normal priority.
    - name: priority/backlog
      color: "#c2e0c6"
      description: Valid but not currently prioritized.
  effort:
    - name: effort/small
      color: "#91ca55"
      description: Small, well-contained change.
    - name: effort/medium
      color: "#fef2c0"
      description: Moderate implementation effort.
    - name: effort/large
      color: "#fbca04"
      description: Large or uncertain implementation effort.
  community:
    - name: community/good-first-issue
      color: "#7057ff"
      description: Good issue for a first-time contributor.
    - name: community/help-wanted
      color: "#008672"
      description: Extra attention or outside contribution welcome.
  resolution:
    - name: resolution/duplicate
      color: "#cfd3d7"
      description: Duplicate of another issue or pull request.
    - name: resolution/declined
      color: "#cfd3d7"
      description: Declined or will not be implemented.

migrations:
  - old: bug
    new: type/bug
  - old: documentation
    new: type/docs
  - old: enhancement
    new: type/feature
  - old: duplicate
    new: resolution/duplicate
  - old: wontfix
    new: resolution/declined
  - old: question
    new: type/question
  - old: good first issue
    new: community/good-first-issue
  - old: help wanted
    new: community/help-wanted

keep:
  - dependencies
  - github_actions
  - javascript
  - released

delete:
  - invalid
