name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One gitleaks pin shared by every job that installs it on Linux (the
# install-gitleaks composite action verifies the tarball against this
# SHA256 before extracting). Source of the checksum: the official release
# checksums file
# https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
# (line for gitleaks_8.30.1_linux_x64.tar.gz). Bump both together.
env:
  GITLEAKS_VERSION: "8.30.1"
  GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"

permissions:
  contents: read

jobs:
  lint-test-serial:
    name: lint-test-serial (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install shellcheck and shfmt (Linux)
        if: runner.os == 'Linux'
        run: |
          # Retry apt-get to survive transient mirror outages (e.g. azure
          # ubuntu mirror DNS hiccups). 3 attempts with exponential backoff;
          # --fix-missing tolerates partial archive availability.
          # zsh is required by `make lint-strict` to validate .zsh files via
          # `zsh -n`; Ubuntu runners don't have it preinstalled. Without it,
          # lint-strict exits 3 ("zsh not installed") and masks downstream
          # test failures. macOS runners already ship zsh.
          for attempt in 1 2 3; do
            if sudo apt-get update && \
               sudo apt-get install -y --fix-missing shellcheck zsh; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((5 * (3 ** (attempt - 1))))
              echo "apt-get attempt $attempt failed; retrying in ${delay}s..."
              sleep "$delay"
            else
              echo "apt-get failed after 3 attempts" >&2
              exit 1
            fi
          done
          # shfmt: install latest binary release directly (apt version often stale)
          SHFMT_VERSION="3.13.1"
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version

      - name: Install gitleaks (Linux)
        # Real-binary tests in tests/gitleaks-hook.bats run instead of skip.
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-gitleaks
        with:
          version: ${{ env.GITLEAKS_VERSION }}
          sha256: ${{ env.GITLEAKS_SHA256 }}

      - name: Install shellcheck, shfmt, gitleaks (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS runners have brew preinstalled. shellcheck, shfmt, and
          # gitleaks are all bottles, so this is fast. gitleaks lets the
          # real-binary tests in tests/gitleaks-hook.bats run instead of skip.
          brew install shellcheck shfmt gitleaks
          # GNU tools: tests/gitleaks-private.bats re-runs the store validator
          # with GNU stat/awk/sed/grep first on PATH (skipped when absent).
          brew install coreutils gawk gnu-sed grep
          shellcheck --version
          shfmt --version
          gitleaks version
          git --version

      - name: Lint (errors only)
        run: make lint-strict

      - name: Format check
        run: make fmt-check

      - name: Run tests
        # Explicit `shell: bash` runs with -eo pipefail, so tee keeps the
        # bats exit status. bats writes TAP when stdout is not a TTY.
        shell: bash
        run: make test-serial 2>&1 | tee "$RUNNER_TEMP/bats.tap"

      - name: Require the real-gitleaks hook tests to have run (not skipped)
        if: ${{ !cancelled() }}
        shell: bash
        run: .github/scripts/require-real-gitleaks-tests.sh "$RUNNER_TEMP/bats.tap"

  lint-test-parallel:
    name: lint-test-parallel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Ensure GNU parallel, zsh, shellcheck, shfmt (Linux)
        if: runner.os == 'Linux'
        run: |
          # parallel is required by `bats --jobs` for cross-file parallelism;
          # zsh is required by tests that source .zsh files (init_*, compat,
          # aliases, etc); shellcheck + shfmt are required by scripts-doctor
          # tests which check for them on PATH. Ubuntu runners ship none of
          # these by default.
          # Retry apt-get to survive transient mirror outages (e.g. azure
          # ubuntu mirror DNS hiccups). 3 attempts with exponential backoff;
          # --fix-missing tolerates partial archive availability.
          for attempt in 1 2 3; do
            if sudo apt-get update && \
               sudo apt-get install -y --fix-missing parallel zsh shellcheck; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((5 * (3 ** (attempt - 1))))
              echo "apt-get attempt $attempt failed; retrying in ${delay}s..."
              sleep "$delay"
            else
              echo "apt-get failed after 3 attempts" >&2
              exit 1
            fi
          done
          # shfmt: install latest binary release directly (apt version often stale)
          SHFMT_VERSION="3.13.1"
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          parallel --version | head -1
          zsh --version
          shellcheck --version | head -1
          shfmt --version

      - name: Install gitleaks (Linux)
        # Real-binary tests in tests/gitleaks-hook.bats run instead of skip.
        if: runner.os == 'Linux'
        uses: ./.github/actions/install-gitleaks
        with:
          version: ${{ env.GITLEAKS_VERSION }}
          sha256: ${{ env.GITLEAKS_SHA256 }}

      - name: Ensure GNU parallel, shellcheck, shfmt, gitleaks (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS already ships zsh. parallel + shellcheck + shfmt come from brew.
          # scripts-doctor tests require shellcheck and shfmt on PATH.
          command -v parallel >/dev/null 2>&1 || brew install parallel
          command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
          command -v shfmt >/dev/null 2>&1 || brew install shfmt
          # gitleaks: real-binary tests in tests/gitleaks-hook.bats.
          command -v gitleaks >/dev/null 2>&1 || brew install gitleaks
          # GNU tools for the GNU-first PATH test in tests/gitleaks-private.bats.
          brew install coreutils gawk gnu-sed grep
          parallel --version | head -1
          shellcheck --version | head -1
          shfmt --version
          gitleaks version
          git --version

      - name: Lint (errors only)
        run: make lint-strict

      - name: Format check
        run: make fmt-check

      - name: Run tests in parallel
        shell: bash
        run: make test-parallel 2>&1 | tee "$RUNNER_TEMP/bats.tap"

      - name: Require the real-gitleaks hook tests to have run (not skipped)
        if: ${{ !cancelled() }}
        shell: bash
        run: .github/scripts/require-real-gitleaks-tests.sh "$RUNNER_TEMP/bats.tap"

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # gitleaks needs full history to scan the diff and (if configured)
          # the historical commits. fetch-depth: 0 disables the default
          # shallow clone.
          fetch-depth: 0

      - name: Install gitleaks CLI
        # Self-hosted CLI install (instead of gitleaks/gitleaks-action@v2,
        # which is pinned to a deprecated Node runtime). Same checksum-pinned
        # composite action and version as the test jobs.
        uses: ./.github/actions/install-gitleaks
        with:
          version: ${{ env.GITLEAKS_VERSION }}
          sha256: ${{ env.GITLEAKS_SHA256 }}

      - name: Run gitleaks
        # `gitleaks git` scans the full git history (`detect` is deprecated).
        # --redact prevents secrets from appearing in CI logs. Exit code 1
        # (default) fails the job on any finding.
        run: gitleaks git --redact --no-banner --verbose .
