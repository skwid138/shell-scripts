name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-test-serial:
    name: shellcheck + bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install shellcheck and shfmt (Linux)
        if: runner.os == 'Linux'
        run: |
          # Retry apt-get to survive transient mirror outages (e.g. azure
          # ubuntu mirror DNS hiccups). 3 attempts with exponential backoff;
          # --fix-missing tolerates partial archive availability.
          # zsh is required by `make lint-strict` to validate .zsh files via
          # `zsh -n`; Ubuntu runners don't have it preinstalled. Without it,
          # lint-strict exits 3 ("zsh not installed") and masks downstream
          # test failures. macOS runners already ship zsh.
          for attempt in 1 2 3; do
            if sudo apt-get update && \
               sudo apt-get install -y --fix-missing shellcheck zsh; then
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              delay=$((5 * (3 ** (attempt - 1))))
              echo "apt-get attempt $attempt failed; retrying in ${delay}s..."
              sleep "$delay"
            else
              echo "apt-get failed after 3 attempts" >&2
              exit 1
            fi
          done
          # shfmt: install latest binary release directly (apt version often stale)
          SHFMT_VERSION="3.13.1"
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          shellcheck --version
          shfmt --version

      - name: Install shellcheck and shfmt (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS runners have brew preinstalled. shellcheck and shfmt are
          # both available as bottles, so this is fast.
          brew install shellcheck shfmt
          shellcheck --version
          shfmt --version

      - name: Lint (errors only)
        run: make lint-strict

      - name: Format check
        run: make fmt-check

      - name: Run tests
        run: make test-serial

  lint-test-parallel:
    name: bats parallel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Ensure GNU parallel, zsh, shellcheck, shfmt (Linux)
        if: runner.os == 'Linux'
        run: |
          # parallel is required by `bats --jobs` for cross-file parallelism;
          # zsh is required by tests that source .zsh files (init_*, compat,
          # aliases, etc); shellcheck + shfmt are required by scripts-doctor
          # tests which check for them on PATH. Ubuntu runners ship none of
          # these by default.
          sudo apt-get update
          sudo apt-get install -y parallel zsh shellcheck
          # shfmt: install latest binary release directly (apt version often stale)
          SHFMT_VERSION="3.13.1"
          curl -fsSL -o /tmp/shfmt \
            "https://github.com/mvdan/sh/releases/download/v$SHFMT_VERSION/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x /tmp/shfmt
          sudo mv /tmp/shfmt /usr/local/bin/shfmt
          parallel --version | head -1
          zsh --version
          shellcheck --version | head -1
          shfmt --version

      - name: Ensure GNU parallel, shellcheck, shfmt (macOS)
        if: runner.os == 'macOS'
        run: |
          # macOS already ships zsh. parallel + shellcheck + shfmt come from brew.
          # scripts-doctor tests require shellcheck and shfmt on PATH.
          command -v parallel >/dev/null 2>&1 || brew install parallel
          command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
          command -v shfmt >/dev/null 2>&1 || brew install shfmt
          parallel --version | head -1
          shellcheck --version | head -1
          shfmt --version

      - name: Lint (errors only)
        run: make lint-strict

      - name: Format check
        run: make fmt-check

      - name: Run tests in parallel
        run: make test-parallel

  gitleaks:
    name: gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          # gitleaks needs full history to scan the diff and (if configured)
          # the historical commits. fetch-depth: 0 disables the default
          # shallow clone.
          fetch-depth: 0

      - name: Install gitleaks CLI
        # Self-hosted CLI install (instead of gitleaks/gitleaks-action@v2)
        # because that action is pinned to Node 20, which GitHub is
        # deprecating. The CLI is a single Go binary; pin via env var.
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Run gitleaks
        # `detect` scans the full git history (matches gitleaks-action default
        # on push). --redact prevents secrets from appearing in CI logs.
        # --exit-code 1 (default) fails the job on any finding.
        run: gitleaks detect --source . --redact --no-banner --verbose
